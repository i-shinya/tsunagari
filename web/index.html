<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tsunagari</title>
<link rel="stylesheet" href="/src/fonts.css">
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#fdfdfb}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#fdfdfb}
[hidden]{display:none!important}
#app{height:100dvh;--shu-hover:#c3301a;scrollbar-color:var(--rule-2) transparent}
#app button svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.tg .pri{background:var(--shu);border-color:var(--shu);color:#fff}
.tg .pri:hover{background:var(--shu-hover)}
.tg .pri[aria-disabled="true"]{background:var(--paper-2);border-color:var(--rule-2);color:var(--ink-3)}
.note{font-size:13px;color:var(--ink-2)}
.note:empty{display:none}
.fine{margin:0;font-size:12px;color:var(--ink-3)}
.fine:empty{display:none}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chk input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.tg-col{display:flex;flex-direction:column;scroll-padding:64px 0 96px}
.tools{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 16px 8px var(--padl);background:var(--paper);border-bottom:1px solid var(--rule);container-type:inline-size}
#copy-note:empty{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#copy{margin-left:auto}
.grp{display:contents}
#in-note{margin:8px 16px 0 var(--padl);font-size:13px;color:var(--ink-2)}
#in-note.bad{color:var(--shu-ink)}
#in-note:empty{display:none}
#in{display:flex;flex-direction:column;gap:8px;padding:16px 16px 0 var(--padl);flex:1 0 auto}
#pad{flex:1;min-height:320px;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);border:1px solid var(--rule-2);border-radius:4px;background:var(--field)}
#pad:focus-within{border-color:var(--ink-3)}
.drop #pad{border-color:var(--blue);background:#f8faff}
.tg-col.drop{outline:2px dashed var(--blue);outline-offset:-4px}
#md,#lines{grid-area:1/1;width:100%;height:100%;margin:0;padding:12px 16px 12px 52px;border:0;font:400 16px/1.9 var(--f-body);white-space:pre-wrap;overflow-wrap:break-word;scrollbar-gutter:stable}
#md{background:transparent;color:var(--ink);border-radius:4px;resize:none;overflow:auto;caret-color:var(--shu)}
#md:focus-visible{outline:0}
#md::placeholder{color:var(--ink-3)}
#md:read-only{color:var(--ink-2)}
#lines{position:relative;overflow:hidden;color:transparent;counter-reset:ln;pointer-events:none;user-select:none;-webkit-user-select:none}
#lines>div{position:relative;counter-increment:ln}
#lines>div::before{content:counter(ln);position:absolute;right:calc(100% + 12px);color:var(--ink-3);font:500 12px/calc(16px * 1.9) var(--f-ui);font-variant-numeric:tabular-nums}
.eg-h{display:flex;align-items:baseline;gap:12px;padding:16px 16px 0 var(--padl)}
.eg-h h2{margin:0;font:500 15px/1.4 var(--f-ui);white-space:nowrap}
.eg-h p{margin:0;font-size:13px;color:var(--ink-3)}
.tg-col>.tg-doc{flex:1 0 auto}
.tg-row.ed{cursor:default;background:var(--blue-wash)}
.edit{display:grid;gap:8px;padding-block:4px}
.edit textarea{box-sizing:border-box;width:100%;min-height:34px;margin:0;padding:0 8px;border:1px solid var(--blue);border-radius:4px;background:var(--field);color:var(--ink);font:inherit;resize:none;field-sizing:content}
.edit .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:12px/1.6 var(--f-ui);color:var(--ink-3)}
kbd{font:500 11px/1 var(--f-ui);border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:3px;padding:2px 4px;background:var(--field);color:var(--ink-2)}
.dock{position:sticky;bottom:0;z-index:2;display:grid;gap:8px;padding:12px 16px 12px var(--padl);background:var(--paper);border-top:1px solid var(--rule)}
.go{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.go .meta{font-size:13px;color:var(--ink-3);margin-right:auto}
.go .act{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
[data-eg] #in,[data-eg] #pad{flex:none}
[data-eg] #pad{height:120px;min-height:0}
[data-eg] .dock{position:static;border:0;padding-block:8px 0;order:1}
[data-eg] .eg-h,[data-eg] .tg-doc{order:2}
[data-eg] .tg-doc{padding-bottom:64px}
.notice{border:1px solid var(--rule-2);border-radius:4px;background:var(--field);padding:12px 16px;display:grid;gap:8px;font-size:14px}
.notice p{margin:0}
.notice.err{border-color:#e7b3a8;background:#fdf4f2}
.notice .acts{display:flex;gap:8px;flex-wrap:wrap}
.notice progress{width:100%;height:6px;appearance:none;border:0;border-radius:3px;background:var(--paper-3);overflow:hidden}
.notice progress::-webkit-progress-bar{background:var(--paper-3)}
.notice progress::-webkit-progress-value{background:var(--ink);transition:width .2s linear}
.notice progress::-moz-progress-bar{background:var(--ink)}
.notice .row2{display:flex;align-items:center;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
#count{color:var(--ink-2)}
#top>.notice{margin:8px 16px 0 var(--padl)}
.tg-right{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-left:1px solid var(--rule);background:var(--paper-2)}
.tg-right>.tg-side{border-left:0;flex:1}
.tg-side>.wait{margin:0;padding:16px 24px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
#set[aria-expanded="true"]{background:var(--paper-3);border-color:var(--ink)}
#more{border-bottom:1px solid var(--rule)}
#more:not([open]){display:none}
.none{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.set{display:grid;gap:16px;align-content:start;padding:16px 24px}
.set h2{margin:0;font:500 15px/1.4 var(--f-ui)}
.set fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.set legend{font-size:12px;color:var(--ink-3);margin-bottom:4px;padding:0}
.opt{display:grid;grid-template-columns:20px 1fr;gap:4px 8px;align-items:start;padding:8px 12px;border:1px solid var(--rule-2);border-radius:4px;background:var(--field);cursor:pointer;transition:border-color .15s var(--ease)}
.opt:has(input:checked){border-color:var(--ink)}
.opt:has(input:disabled){cursor:default}
.opt input{margin:3px 0 0;accent-color:var(--ink)}
.opt b{font-weight:500}
.opt b span{font-weight:400;color:var(--ink-3)}
.opt small{grid-column:2;font-size:12px;color:var(--ink-3)}
.saved{display:grid;gap:8px;font-size:13px;color:var(--ink-2)}
.saved p{margin:0}
#none-row>p>span,#none-dock>span>span,#none-set>p>span,.fine>span{display:inline-block}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#error{overflow-wrap:anywhere}
#tech{font-variant-numeric:tabular-nums}
@media (min-width:960px){
.narrow,.tg-slot,[data-none] #none-row>p{display:none}
.tg-right:has(#more[open]){overflow:auto}
.tg-right:has(#more[open])>.tg-side{flex:none;overflow:visible}
.tg-right:has(#more[open]) .tg-list{flex:none;overflow:visible}
}
@media (max-width:959px){
.wide{display:none}
.tools{position:static;gap:8px}
.tg-right{display:contents}
#more[open]{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:80vh;overflow:auto;background:var(--paper-2);border:0;border-top:1px solid var(--rule-2);border-radius:12px 12px 0 0;box-shadow:0 -4px 16px rgb(0 0 0/.12);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.set{padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#close-set{justify-self:start}
[data-pane=raw] .tg-side,[data-eg] .tg-side,[data-notice] .tg-side,[data-editing] .tg-side{display:none}
[data-pane=result]:not([data-notice]) .dock{display:none}
#pad{min-height:240px}
#md,#lines{padding:8px 12px 8px 44px}
.tg-btn,.chk{min-height:44px}
.edit .esc{display:none}
}
/* docs/design/web.md「入口」参照 */
@container (width < 740px){
.tools>.sp{display:none}
#copy-note{order:1;flex-basis:100%;text-align:right}
.tools>.grp{order:2;flex-basis:100%;display:flex;align-items:center;gap:inherit;flex-wrap:wrap}
}
@media (max-width:399px){.lg{display:none}}
@media (prefers-reduced-motion:reduce){#app *{transition:none!important}}
</style>
</head>
<body data-pane="raw">
<div class="tg" id="app">
<header class="tg-bar"><span class="tg-brand">tsunagari</span><span class="tg-sum" id="sum"></span><span class="sp"></span><button id="set" type="button" class="tg-btn sm" aria-controls="more" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>設定<span id="set-mark" class="cnote">(未保存)</span></button></header>
<div class="tg-main">
<div class="tg-col" id="col">
<div class="tools">
<button id="raw" type="button" class="tg-btn sm" aria-describedby="raw-note" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2.5l2.5 2.5L6 12.5 3 13l.5-3z"/></svg><span><span class="lg">文章を</span>貼り直す・まとめて直す</span></button>
<span class="grp"><button id="back" type="button" class="tg-btn sm" aria-describedby="back-note" hidden>結果に戻る</button>
<button id="open" type="button" class="tg-btn sm" aria-describedby="open-note"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2H4.5A1.5 1.5 0 0 0 3 3.5v9A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V6z"/><path d="M9 2v4h4"/></svg>ファイルを開く</button>
<input id="file" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown" hidden>
<label id="keep-row" class="chk" hidden><input id="keep" type="checkbox">この端末に残す</label>
<span id="raw-note" class="note" aria-live="polite"></span>
<span id="back-note" class="note" aria-live="polite"></span>
<span id="open-note" class="note" aria-live="polite"></span></span>
<span class="sp"></span>
<span id="copy-note" class="cnote" role="status"></span>
<button id="copy" type="button" class="tg-btn sm" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5h2"/></svg><span id="copy-label">全文をコピー</span></button>
</div>
<div id="top"></div>
<p id="in-note" aria-live="polite"></p>
<section id="in" aria-label="文章全体">
<p id="hint" class="fine" hidden>文章全体を直すか、別の文章を貼り替えて、判定し直します。</p>
<div id="pad"><div id="lines" aria-hidden="true"></div><textarea id="md" placeholder="ここに文章を貼るか、ファイルを落とします(Markdown も読めます)" aria-label="判定する文章"></textarea></div>
</section>
<div id="eg-head" class="eg-h" hidden><h2>見本</h2><p>ある随筆を判定した結果です。<span class="wide">文を押すと、右に前の文とつながりの数が出ます。</span></p></div>
<article class="tg-doc" id="doc" aria-label="本文。上下の矢印で文を移ります" hidden></article>
<div class="dock" id="dock">
<div id="none-dock" class="none narrow" hidden><span><span>モデルがまだこの端末にありません。</span><span>種類を選んでから判定してください。</span><span>判定するときにダウンロードします。</span></span><button id="open-set" type="button" class="tg-btn sm" aria-controls="more">設定を開く</button></div>
<div class="go" id="go"><span class="meta"><span id="meta"></span> <span id="mark"></span></span><span class="act"><span id="run-note" class="note" aria-live="polite"></span><button id="run" type="button" class="tg-btn pri" aria-describedby="run-note">判定する</button></span></div>
<div class="notice" id="prog" hidden><div class="row2"><span id="status" role="status"></span><span id="count"></span></div><progress id="bar"></progress><div><button id="stop" type="button" class="tg-btn sm" hidden>中止</button></div></div>
<div class="notice err" id="stall" hidden><p id="stall-text" role="status"></p><div class="acts"><button id="resume" type="button" class="tg-btn">続きからダウンロード</button><button id="light" type="button" class="tg-btn pri">軽量に替えて判定</button><button id="retry" type="button" class="tg-btn">もう一度判定</button><button id="dismiss" type="button" class="tg-btn">やめる</button></div></div>
<div id="dock-ask"></div>
</div>
</div>
<div class="tg-right">
<details id="more"><summary hidden></summary>
<section class="set" aria-label="モデルの設定">
<div id="none-set" class="notice wide" hidden><p><span>モデルがまだこの端末にありません。</span><span>種類を選んでから判定してください。</span><span>判定するときにダウンロードします。</span></p></div>
<h2>モデル</h2>
<fieldset><legend>モデルの種類</legend>
<label class="opt"><input type="radio" name="variant" value="fp16"><b>標準<span id="size-fp16"></span></b><small>いちばん正確。PC 向け</small></label>
<label class="opt"><input type="radio" name="variant" value="q8"><b>軽量<span id="size-q8"></span></b><small>スマホやメモリの少ない端末向け</small></label>
</fieldset>
<div class="saved">
<div id="none-row"><p><span>まだダウンロードしていません。</span><span>判定するときに取ります。</span></p><div class="wrap"><button id="get" type="button" class="tg-btn sm" aria-describedby="get-note">先にダウンロードだけする</button><span id="get-note" class="note" aria-live="polite"></span></div></div>
<div class="line" id="kept-row"><span id="kept"></span><button id="del" type="button" class="tg-btn sm" aria-describedby="del-note">削除</button></div>
<div class="line" id="lack-row"><span id="lack"></span><button id="fetch" type="button" class="tg-btn sm" aria-describedby="fetch-note">ダウンロード</button></div>
<span id="fetch-note" class="note" aria-live="polite"></span>
<span id="del-note" class="note" aria-live="polite"></span>
<div id="set-ask"></div>
</div>
<p class="fine"><span>文章はこの端末の外に送りません。</span><span>モデルはこの端末の中で動きます。</span></p>
<p id="tech" class="fine"></p>
<p id="error" class="fine"></p>
<button id="close-set" type="button" class="tg-btn sm narrow"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>閉じる</button>
</section>
</details>
<aside class="tg-side" id="side" aria-label="選んだ文と一覧"></aside>
</div>
</div>
</div>
<div id="ask" class="notice" hidden><p id="ask-text" aria-live="polite"></p><div class="acts"><button id="yes" type="button" class="tg-btn pri"></button><button id="no" type="button" class="tg-btn">やめる</button></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
