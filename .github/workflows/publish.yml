name: publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: npm に発行せず確かめるだけにする
        type: boolean
        default: true

permissions: {}

concurrency: publish

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
      - run: test "$(command -v npm)" = "$HOME/.safe-chain/shims/npm"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
      - run: test "$(command -v npm)" = "$HOME/.safe-chain/shims/npm"
      - run: npm ci --ignore-scripts
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: tsunagari-*.tgz
          if-no-files-found: error

  check:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
      version: ${{ steps.sbom.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
      - run: test "$(command -v npm)" = "$HOME/.safe-chain/shims/npm"
      - run: npm ci --ignore-scripts --omit=dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/pack
      - run: tar xzf "$RUNNER_TEMP"/pack/tsunagari-*.tgz -C "$RUNNER_TEMP/pack"
      - run: node src/prepack.ts --check "$RUNNER_TEMP/pack/package"
      - id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP"/pack/tsunagari-*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # npm sbom は devDependencies が入っていないと落ち、ルートの名前は置き場所のディレクトリ名を使う
      - id: sbom
        run: |
          mv "$RUNNER_TEMP/pack/package" "$RUNNER_TEMP/pack/tsunagari"
          cd "$RUNNER_TEMP/pack/tsunagari"
          version=$(node -p "require('./package.json').version")
          npm pkg delete devDependencies
          npm sbom --sbom-format=cyclonedx --sbom-type=application > "$RUNNER_TEMP/tsunagari-$version.cdx.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/tsunagari-*.cdx.json
          if-no-files-found: error

  publish:
    needs: [test, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
      - env:
          SHA256: ${{ needs.check.outputs.sha256 }}
        run: echo "$SHA256  $(ls tsunagari-*.tgz)" | sha256sum -c -
      - env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            npm publish ./tsunagari-*.tgz --provenance
          else
            npm publish ./tsunagari-*.tgz --dry-run
          fi

  release:
    needs: [check, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release create "v$VERSION" "tsunagari-$VERSION.cdx.json" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
